openapi: 3.0.3
info:
  title: Pickfighter API
  description: |-
    Description will be here
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 0.3.2
externalDocs:
  description: Project on GitHub
  url: https://github.com/DoRightt/pickfighter-server
tags:
  - name: store
    description: Access to Petstore orders
    externalDocs:
      description: Find out more about our store
      url: http://swagger.io
  - name: auth
    description: Operations about user
  - name: events
    description: Operations with fight events and bets
  - name: fighters
    description: Fighters API for fighters opperations
paths:
  /api/auth/register:
    post:
      tags:
        - auth
      summary: Creates new User
      description: For valid response should be > 6. 
      operationId: createUser
      requestBody:
        description: Created user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /api/auth/confirmation:
    post:
      tags:
        - auth
      summary: Confirms user registration
      description: Confirms user registration with token from email
      operationId: createUsersWithListInput
      parameters:
        - name: token
          in: query
          description: Unique user token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResult'
  /api/auth/login:
    post:
      tags:
        - auth
      summary: Logs user into the system
      description: ''
      operationId: loginUser
      requestBody:
        description: Login user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid username/password supplied
  /api/auth/logout:
    get:
      tags:
        - auth
      summary: Logs out current logged in user session
      description: ''
      operationId: logoutUser
      parameters: []
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResult'
  /api/auth/profile:
    get:
      tags:
        - auth
      summary: Profile retrieves the user profile
      description: User have to be logged in
      operationId: userProfile
      parameters:
        - name: Authorization
          in: header
          description: 'Auth token'
          example: 'Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...'
          required: true
          schema:
            type: string
        - name: Cookie
          in: header
          description: Cookie header
          example: 'fb_api_token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid token
  /api/auth/password/reset:
    post:
      tags:
        - auth
      summary: Reset user password by user email
      description: ''
      operationId: resetPassword
      requestBody:
        description: ResetPassword object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResult'     
  /api/auth/password/recover:
    post:
      tags:
        - auth
      summary: User password recovery
      operationId: recoverPassword
      requestBody:
        description: RecoverPassword object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverPasswordRequest'
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResult'
                
  /api/events/events:
    get:
      tags:
        - events
      summary: Get fight events list
      description: Returns 5 last events by default
      operationId: getEvents
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
  /api/events/create/event:
    post:
      tags:
        - events
      summary: Creates new event
      description: Only admins can create events
      operationId: createEvent
      requestBody:
        description: Event object to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventResponse'
  /api/events/bets:
    get:
      tags:
        - events
      summary: Get bets
      description: Only logged in user can get bets
      operationId: getBets
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetsResponse'
  /api/events/create/bet:
    post:
      tags:
        - events
      summary: Creates new bet
      description: Only logged in users can create bets
      operationId: createBet
      requestBody:
        description: Bet object to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBetRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBetResponse'
  /api/events/create/result:
    post:
      tags:
        - events
      summary: Add new fight result
      description: Only admins can add results
      operationId: createResult
      requestBody:
        description: Result object to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddResultRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddResultResponse'
    
  /api/fighters/fighters:
    get:
      tags: 
        - fighters
      summary: Get Fighters collection
      operationId: fighters
      parameters:
        - name: status
          in: query
          description: 'Filter by status'
          example: 'Active'
          required: false
          schema:
            type: string
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FightersResponse'
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          example: 'john@email.com'
        password: 
          type: string
          example: '12345'
        remember_me:
          type: boolean
          example: true
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        timestamp:
          type: string
          example: 'Mon, 22 Jan 2025 14:30:00 UTC'
        message:
         type: string
         example: The service is operating normally
        token_id:
          type: string
          example: 'abc123xyz'
        access_token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9'
        expires_at:
          type: string
          example: 'Mon, 25 Jan 2025 14:30:00 UTC'
    UserProfile:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        name:
          type: string
          example: 'John Doe'
        email:
          type: string
          example: '123445abc'
        flags:
          type: integer
          example: 0
        created_at:
          type: integer
          example: 12345678987665432
        updated_at:
          type: integer
          example: 12345678987665432
    UserRequest:
      type: object
      properties:
        name:
          type: string
          example: 'John Doe'
        email:
          type: string
          example: 'john@email.com'
        password:
          type: string
          example: '12345'
        terms_ok:
          type: boolean
          description: 'Registration conditions accepted'
          example: true
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          example: 'john@email.com'
    RecoverPasswordRequest:
      type: object
      properties:
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9'
        password:
          type: string
          example: '987654321'
        confirm_password:
          type: string
          example: '987654321'
          
    CreateEventRequest:
      type: object
      properties:
        name:
          type: string
          example: 'UFC 313'
        fights:
          type: array
          items:
            $ref: '#/components/schemas/Fight'
    CreateEventResponse:
      type: object
      properties:
        id: 
          type: integer
          example: 5
        success:
          type: boolean
          example: true
        timestamp:
          type: string
          example: 'Mon, 22 Jan 2025 14:30:00 UTC'
        message:
         type: string
         example: 'The service is operating normally'
    EventsResponse:
      type: object
      properties:
        count:
          type: integer
          example: 5
        results:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    CreateBetRequest:
      type: object
      properties:
        fight_id:
          type: integer
          example: 4
        user_id:
          type: integer
          example: 1
        fighter_id:
          type: integer
          example: 213
    CreateBetResponse:
      type: object
      properties:
        id: 
          type: integer
          example: 5
        success:
          type: boolean
          example: true
        timestamp:
          type: string
          example: 'Mon, 22 Jan 2025 14:30:00 UTC'
        message:
         type: string
         example: 'The service is operating normally'
    BetsResponse:
      type: object
      properties:
        count:
          type: integer
          example: 5
        results:
          type: array
          items:
            $ref: '#/components/schemas/Bet'
    AddResultRequest:
      type: object
      properties:
        fight_id:
          type: integer
          example: 4
        winner_id:
          type: integer
          example: 1
        cont_contest:
          type: boolean
          example: false
        is_draw:
          type: boolean
          example: false
    AddResultResponse:
      type: object
      properties:
        id: 
          type: integer
          example: 5
        success:
          type: boolean
          example: true
        timestamp:
          type: string
          example: 'Mon, 22 Jan 2025 14:30:00 UTC'
        message:
         type: string
         example: 'The service is operating normally'
    Event:
      type: object
      properties:
        event_id:
          type: integer
          example: 123
        name: 
          type: string
          example: 'UFC 313'
        is_done:
          type: boolean
          example: false
        fights:
          type: array
          items:
            $ref: '#/components/schemas/Fight'
    Bet:
      type: object
      properties:
        bet_id:
          type: integer
          example: 1
        fight_id:
          type: integer
          example: 27
        user_id:
          type: integer
          example: 17
        fighter_id:
          type: integer
          example: 33
          
    FightersResponse:
      type: object
      properties:
        count: 
          type: integer
          example: 5
        results: 
          type: array
          items:
            $ref: '#/components/schemas/Fighter'
    Fighter:
      type: object
      properties:
        fighter_id:
          type: integer
          example: 123
        name:
          type: string
          example: "Bobby Knuckles"
        nickName:
          type: string
          example: "The Reaper"
        division_id:
          type: integer
          example: 4
        status:
          type: string
          enum:
            - "Active"
            - "Retired"
            - "Not Fighting"
          example: "Active"
        hometown:
          type: string
          example: "New York"
        trainsAt:
          type: string
          example: "XYZ Gym"
        fightingStyle:
          type: string
          example: "Boxing"
        age:
          type: integer
          example: 28
        height:
          type: number
          format: float
          example: 1.85
        weight:
          type: number
          format: float
          example: 77.5
        octagonDebut:
          type: string
          example: "2015-05-01"
        debutTimestamp:
          type: integer
          example: 1430457600
        reach:
          type: number
          format: float
          example: 1.95
        legReach:
          type: number
          format: float
          example: 1.10
        wins:
          type: integer
          example: 20
        loses:
          type: integer
          example: 5
        draw:
          type: integer
          example: 1
        fighterUrl:
          type: string
          example: "https://example.com/fighter/123"
        imageUrl:
          type: string
          example: "https://example.com/images/fighter123.jpg"
        stats:
          type: object
          properties:
            stat_id:
              type: integer
              example: 456
            fighter_id:
              type: integer
              example: 123
            totalSigStrLanded:
              type: integer
              example: 200
            totalSigStrAttempted:
              type: integer
              example: 400
            strAccuracy:
              type: integer
              example: 50
            totalTkdLanded:
              type: integer
              example: 50
            totalTkdAttempted:
              type: integer
              example: 100
            tkdAccuracy:
              type: integer
              example: 50
            sigStrLanded:
              type: number
              format: float
              example: 150.5
            sigStrAbs:
              type: number
              format: float
              example: 80.5
            sigStrDefense:
              type: integer
              example: 70
            takedownDefense:
              type: integer
              example: 65
            takedownAvg:
              type: number
              format: float
              example: 2.5
            submissionAvg:
              type: number
              format: float
              example: 1.2
            knockdownAvg:
              type: number
              format: float
              example: 0.5
            avgFightTime:
              type: string
              example: "00:15:30"
            winByKO:
              type: integer
              example: 10
            winBySub:
              type: integer
              example: 5
            winByDec:
              type: integer
              example: 5
    Fight:
      type: object
      properties:
        fight_id:
          type: integer
          example: 101
        event_id:
          type: integer
          example: 202
        fighter_red:
          $ref: '#/components/schemas/Fighter'
        fighter_blue:
          $ref: '#/components/schemas/Fighter'
        is_done:
          type: boolean
          example: true
        is_canceled:
          type: boolean
          example: false
        not_contest:
          type: boolean
          example: false
        result:
          type: integer
          example: 1
        created_at:
          type: integer
          format: int64
          example: 1672531200
        fight_date:
          type: integer
          example: 1672617600
          
    SuccessfulResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        timestamp:
          type: string
          example: 'Mon, 22 Jan 2025 14:30:00 UTC'
        message:
         type: string
         example: 'The service is operating normally'